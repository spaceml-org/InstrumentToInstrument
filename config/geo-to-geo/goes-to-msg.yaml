data:
  load_from_numpy: True # If True, we don't need the converted_path or patch_sizes
  A_satellite: goes
  A_path: /mnt/disks/data/iti-converted/goes-3000m
  A_bands: [
            470.0,
            640.0,
            870.0,
            1380.0,
            1610.0,
            2250.0,
            3890.0,
            6170.0,
            6930.0,
            7340.0,
            8440.0,
            9610.0,
            10330.0,
            11190.0,
            12270.0,
            13270.0,
        ]
  B_satellite: msg
  B_path: /mnt/disks/data/iti-converted/msg
  B_bands: [
            640.0,
            810.0,
            1640.0,
            3920.0,
            6250.0,
            7350.0,
            8700.0,
            9660.0,
            10800.0,
            12000.0,
            13400.0,
        ]
  filter_daytime: False
  stats_filepath: /data/2025-esl-3dclouds-extremes-datasets/pre-training-reprocessed/pretrain_stats.csv
model:
  input_dim_a: 1
  input_dim_b: 1
  upsampling: 0
  discriminator_mode: CHANNELS
  lambda_diversity: 0
  norm: 'in_rs_aff'
  use_batch_statistic: False
  # Set the identity loss to 0
  # lambda_reconstruction_id: 0
  # lambda_content_id: 0
logging:
  wandb_entity: itieo
  wandb_project: GOES16-to-MSG
  wandb_name: GOES16-MSG-X
  tags: [msg, goes16]
training:
  epochs: 100
  limit_train_batches: null
  limit_val_batches: 0.5
  num_workers: 8
  iterations_per_epoch: 1000
seed: 42
