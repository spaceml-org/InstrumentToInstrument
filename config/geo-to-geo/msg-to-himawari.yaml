data:
  load_from_numpy: True # If True, we don't need the converted_path or patch_sizes
  A_satellite: msg
  # A_path: /mnt/disks/pretraining/2025-esl-3dclouds-extremes-datasets/pre-training/himawari/l1b
  A_path: /mnt/disks/data/iti-converted/msg
  # A_patch_size: (256, 256) # Larger patches for storage.
  # converted_A_path: /home/annajungbluth/tmp-data/himawari
  # converted_A_patch_size: (256, 256) # Smaller patches for training.
  # A_resolution: null # If null, native resolution of the satellite is used.
  # A_center_crop: False # Crop always around the center with given radius.
  # A_radius: 0
  A_bands: [
            640.0,
            810.0,
            1640.0,
            3920.0,
            6250.0,
            7350.0,
            8700.0,
            9660.0,
            10800.0,
            12000.0,
            13400.0,
        ]

  B_satellite: himawari
  # B_path: /mnt/disks/pretraining/2025-esl-3dclouds-extremes-datasets/pre-training/goes/mcmip
  B_path: /mnt/disks/data/iti-converted/himawari-3000m
  # B_patch_size: (256, 256) # Larger patches for storage.
  # converted_B_path: /home/annajungbluth/tmp-data/goes
  # converted_B_patch_size: (256, 256) # Smaller patches for training.
  # B_resolution: null # If null, native resolution of the satellite is used.
  # B_center_crop: False # Crop always around the center with given radius.
  # B_radius: 0
  B_bands: [
            470.0,
            510.0,
            640.0,
            860.0,
            1600.0,
            2300.0,
            3900.0,
            6200.0,
            6900.0,
            7300.0,
            8600.0,
            9600.0,
            10400.0,
            11200.0,
            12400.0,
            13300.0,
        ]
  filter_daytime: False
  stats_filepath: /data/2025-esl-3dclouds-extremes-datasets/pre-training-reprocessed/pretrain_stats.csv
model:
  input_dim_a: 1
  input_dim_b: 1
  upsampling: 0
  discriminator_mode: CHANNELS
  lambda_diversity: 0
  norm: 'in_rs_aff'
  use_batch_statistic: False
  # Set the identity loss to 0
  # lambda_reconstruction_id: 0
  # lambda_content_id: 0
logging:
  wandb_entity: itieo
  wandb_project: MSG-to-HIMAWARI8
  wandb_name: MSG-HIMAWARI8-X
  tags: [msg, himawari8]
training:
  epochs: 100
  limit_train_batches: null
  limit_val_batches: 0.5
  num_workers: 8
  iterations_per_epoch: 1000
seed: 42
